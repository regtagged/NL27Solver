<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-draw strategy — 2-7 Lowball (Single Draw)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #131316;
    --panel: #1b1b1f;
    --raised: #232328;
    --line: rgba(255, 255, 255, 0.13);
    --ink: #eeeef2;
    --ink-2: #b4b4bd;
    --ink-3: #81818b;
    --chip: rgba(255, 255, 255, 0.07);
    --accent: #5b8ff9;
    --fold: #6c727a;
    --call: #40ac68;
    --raise: #d8a03c;
    --threebet: #c9433b;
    --allin: #9b6bef;
    --loss: #c9433b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* One nav on every page, so the three views are one tool rather than three.
     The current page is marked rather than linked, which is what says where
     you are without a second glance. */
  .views-nav { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .views-nav a, .views-nav span {
    font-size: 12px; padding: 5px 11px; border-radius: 999px; text-decoration: none;
    border: 1px solid var(--line); color: var(--ink-2); background: var(--raised);
    white-space: nowrap; margin-left: 0;
  }
  .views-nav a:hover { border-color: var(--accent); color: var(--ink); }
  .views-nav [aria-current="page"] {
    border-color: var(--accent); color: var(--ink); font-weight: 600;
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  header { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  h1 { margin: 2px 0 0; font-size: 20px; text-transform: uppercase; letter-spacing: .01em; }
  header a { margin-left: auto; color: var(--accent); font-size: 13px; }

  main { padding: 18px 24px 48px; max-width: 1180px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .panel > h2 {
    margin: 0; padding: 11px 14px; font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 600;
    border-bottom: 1px solid var(--line);
  }

  /* The seat strip is the navigation: every action is a link to where it goes. */
  .seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; padding: 12px; }
  .seat { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--raised); }
  .seat.is-acting { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .who { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .pos { font-weight: 700; font-size: 13px; }
  button.pos { border: 0; background: none; color: var(--ink); cursor: pointer; padding: 0; font-family: inherit; }
  button.pos:hover { color: var(--accent); text-decoration: underline; }
  .bb { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .lines { display: flex; flex-direction: column; gap: 3px; }
  .lines button, .lines span {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 7px; padding: 3px 7px; cursor: pointer;
  }
  .lines button:hover { border-color: var(--accent); color: var(--ink); }
  .lines span { cursor: default; opacity: .75; }
  /* What this seat did, beside what it could have done: one is history and the
     rest are still links, so they must not read as the same thing. */
  .lines .taken { background: var(--chip); font-weight: 600; color: var(--ink); }
  .lines .ahead { border-style: dotted; }

  .line-note { padding: 0 14px 12px; font-size: 12px; color: var(--ink-3); }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; text-align: right; }
  th:first-child { text-align: left; }
  td.name { font-variant-numeric: tabular-nums; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  tr.category > td.name { font-weight: 700; }
  tr.whole > td { background: var(--chip); font-weight: 700; border-bottom: 2px solid var(--line); }
  tr.hand > td.name { color: var(--ink-2); }
  tbody tr:hover { background: var(--chip); }

  .twist { display: inline-block; width: 14px; color: var(--ink-3); }
  .name button {
    font: inherit; border: 0; background: none; color: inherit; cursor: pointer;
    padding: 0; text-align: left;
  }
  .name button:hover { color: var(--accent); }

  .bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--chip); min-width: 160px; }
  .bar i { display: block; }
  .mix { display: flex; gap: 8px; justify-content: flex-end; font-variant-numeric: tabular-nums; font-size: 12px; }
  .mix span { min-width: 42px; text-align: right; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend { display: flex; gap: 16px; padding: 10px 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
  .loading { padding: 40px; text-align: center; color: var(--ink-3); }

  /*
   * One structure at a time. Two sizings are two different games - different
   * trees, different actions - so they are switched between rather than mixed,
   * and switching keeps your place in the hand wherever the other has that line.
   */
  .views { display: flex; gap: 8px; padding: 12px 12px 0; flex-wrap: wrap; }
  .views button {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--raised); color: var(--ink-2);
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left;
  }
  .views .sizing { font-size: 13px; }
  .views button:hover { border-color: var(--accent); color: var(--ink); }
  .views button[aria-pressed="true"] {
    border-color: var(--accent); color: var(--ink); font-weight: 700;
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .views .count { color: var(--ink-3); font-weight: 400; }

  /* A seat's box is the way to its own decision, not just the label above it. */
  .seat[data-node] { cursor: pointer; }
  .seat[data-node]:hover { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Pre-draw strategy</div>
    <h1 id="title">2-7 Lowball (Single Draw)</h1>
  </div>
  <div class="eyebrow" id="meta"></div>
  <nav class="views-nav">
    <a href="/">Ranked hands</a>
    <span aria-current="page">2-7 pre-draw</span>
    <a href="/pushfold.html">Hold'em push-fold</a>
  </nav>
</header>

<main>
  <section class="panel" style="margin-bottom:18px">
    <h2>The table</h2>
    <div class="views" id="views"></div>
    <div class="seats" id="seats"></div>
    <p class="line-note" id="line"></p>
  </section>

  <section class="panel">
    <h2 id="rangeTitle">Range</h2>
    <div class="legend" id="legend"></div>
    <div id="range"><div class="loading">Loading…</div></div>
  </section>
</main>

<script type="module">
const state = { node: 0, view: 0, open: new Set(['Pat']), data: null, views: [], note: '' };
const $ = (id) => document.getElementById(id);

/*
 * Colour says what an action is, so it has to come off the kind and not the
 * label: "raise 2.5x" and "raise 3x" are one thing at two sizes, and a 3-bet
 * that is not all-in is a different thing from one that is.
 */
const COLOURS = {
  fold: 'var(--fold)',
  check: 'var(--fold)',
  call: 'var(--call)',
  raise: 'var(--raise)',
  threebet: 'var(--threebet)',
  allin: 'var(--allin)',
  bet: 'var(--raise)',
};
const colourFor = (action) => COLOURS[action?.kind] ?? 'var(--accent)';

async function load(node, view = state.view) {
  state.node = node;
  state.view = view;
  const answer = await fetch(`/api/strategy?node=${node}&view=${view}`).then((r) => r.json());
  if (!answer.running) {
    $('range').innerHTML = '<div class="loading">Start the server with <code>--solve</code> to browse strategies.</div>';
    return;
  }
  state.data = answer;
  render();
}

/**
 * Switching structure keeps your place in the hand.
 *
 * The two trees have different nodes, so the server is asked for the same line
 * rather than the same id. A line the other structure does not have - anything
 * under a sized 3-bet, when the other only has the jam - lands at the top and
 * says so.
 */
async function switchTo(view) {
  if (view === state.view) return;
  const answer = await fetch(`/api/same?from=${state.view}&to=${view}&node=${state.node}`)
    .then((r) => r.json());
  state.note = answer.exact ? '' : 'That line does not exist under this structure.';
  await load(answer.node, view);
}

/** The game in the header: the same one, sized the way this structure sizes it. */
function renderMeta() {
  const view = state.views[state.view];
  const c = view.config;
  // The dead money is what the ante is really saying, so it is shown as well
  // as the per-player figure: 0.6bb each is 4.2bb in the middle seven-handed.
  const posters = c.anteMode === 'button' ? 1 : state.players;
  const dead = c.ante ? c.ante * posters : 0;
  const ante = c.ante
    ? ` &nbsp;·&nbsp; ante ${c.ante}bb ${c.anteMode === 'button' ? 'button' : 'each'}`
      + ` <strong>(${dead.toFixed(1)}bb dead)</strong>`
    : ' &nbsp;·&nbsp; no ante';
  const pot = (dead + c.smallBlind + c.bigBlind).toFixed(1);
  $('meta').innerHTML = `${state.players}-handed &nbsp;·&nbsp; <strong>${c.stack}bb</strong>`
    + ` &nbsp;·&nbsp; ${c.smallBlind}/${c.bigBlind}${ante}`
    + ` &nbsp;·&nbsp; ${pot}bb to win`
    + ` &nbsp;·&nbsp; ${view.iterations.toLocaleString()} iterations`;
}

function renderViews() {
  if (state.views.length < 2) {
    $('views').hidden = true;
    return;
  }
  // The sizing names the structure, but the game under it - seats and dead
  // money - is what makes two sizings worth comparing at all, so it is on the
  // button rather than only in the header.
  $('views').innerHTML = state.views.map((view) =>
    `<button data-view="${view.index}" aria-pressed="${view.index === state.view}">`
    + `<span class="sizing">${view.label}</span>`
    + `<span class="count">${view.game} · ${(view.iterations / 1e6).toFixed(0)}M</span></button>`).join('');
  for (const button of $('views').querySelectorAll('button[data-view]')) {
    button.onclick = () => switchTo(Number(button.dataset.view));
  }
}

/**
 * The seat strip, which doubles as the navigation.
 *
 * Every seat shows the whole of its own decision, not just its part in this
 * line: the action it took is marked and the ones it passed up are still links,
 * so a hand can be walked back and sent down the other road. A seat not yet in
 * the hand has no decision here yet, so it shows the one it would face if
 * everyone between folded, which is how people ask about it anyway.
 *
 * The box around them goes back to the decision itself, where that seat's range
 * is - which is the question after "what else could it have done".
 */
function renderSeats() {
  const d = state.data;
  // Action order, not seat order: UTG first and the blinds last, which is how
  // the decisions actually come round.
  const order = state.order ?? d.jumps.map((_, seat) => seat);

  $('seats').innerHTML = order.map((seat) => {
    const acting = seat === d.seat;
    const jump = d.jumps[seat];
    let lines;
    if (acting) {
      lines = d.actions.map((action) => action.child >= 0
        ? `<button data-node="${action.child}" style="border-left:3px solid ${colourFor(action)}">${action.label}</button>`
        : `<span>${action.label}</span>`);
    } else if (jump && jump.node >= 0) {
      lines = jump.actions.map((action, i) => action.child >= 0
        ? `<button class="${i === jump.took ? 'taken' : 'ahead'}" data-node="${action.child}"`
          + ` style="border-left:3px solid ${colourFor(action)}">${action.label}</button>`
        : `<span>${action.label}</span>`);
    } else {
      lines = ['<span>—</span>'];
    }

    // The whole box is the way to that seat's own decision - the question is
    // "what does the button do here", and the answer should be one click on the
    // button's box, not on a particular word inside it.
    const to = acting ? -1 : (jump?.node ?? -1);
    const title = jump?.took >= 0
      ? `Back to ${seatName(seat)}'s decision`
      : `${seatName(seat)}'s decision, folded round`;
    return `<div class="seat${acting ? ' is-acting' : ''}"`
      + `${to >= 0 ? ` data-node="${to}" title="${title}"` : ''}>`
      + `<div class="who"><span class="pos">${seatName(seat)}</span>`
      + `<span class="bb">${state.stacks?.[seat] ?? ''}bb</span></div>`
      + `<div class="lines">${lines.join('')}</div></div>`;
  }).join('');

  for (const button of $('seats').querySelectorAll('button[data-node]')) {
    button.onclick = (event) => {
      // The buttons inside a box lead somewhere of their own, so a click on one
      // is not also a click on the box around it.
      event.stopPropagation();
      load(Number(button.dataset.node));
    };
  }
  for (const box of $('seats').querySelectorAll('.seat[data-node]')) {
    box.onclick = () => load(Number(box.dataset.node));
  }

  const line = d.sequence.length
    ? d.sequence.map((entry) => `${entry.name} ${entry.label}`).join(' · ')
    : 'First in.';
  $('line').textContent = state.note ? `${line} — ${state.note}` : line;
  state.note = '';
  $('rangeTitle').textContent = `${d.seatName} range`;
}

let names = [];
const seatName = (seat) => names[seat] ?? `S${seat}`;

function renderLegend() {
  $('legend').innerHTML = state.data.actions.map((action) =>
    `<span><i class="swatch" style="background:${colourFor(action)}"></i>${action.label}</span>`).join('');
}

function rowsOf(tree, depth = 0, prefix = '') {
  const out = [];
  for (const node of tree) {
    const id = prefix ? `${prefix}/${node.label}` : node.label;
    out.push({ id, depth, node });
    if (node.children.length && state.open.has(id)) out.push(...rowsOf(node.children, depth + 1, id));
  }
  return out;
}

function renderRange() {
  const d = state.data;
  const rows = rowsOf(d.tree);
  const head = '<tr><th>Hand</th><th>Combos</th><th>Mix</th>'
    + d.actions.map((a) => `<th>${a.label}</th>`).join('')
    + '<th title="Big blinds won per hand, holding this and reaching this decision">EV (bb)</th></tr>';

  /**
   * Chips are hundredths of a big blind, so this divides by a hundred.
   *
   * Big blinds, not big blinds per hundred hands. A win rate is a property of a
   * strategy over many hands; what one hand is worth is a property of the hand,
   * and quoting a pat seven at "+2,103 bb/100" is arithmetically true and
   * useless. The range's figure in the top row is the one that means a win
   * rate, and it is a hundred times the number shown there.
   */
  const money = (ev) => {
    if (ev === null || ev === undefined) return '<td class="num ev">—</td>';
    const bb = ev / 100;
    const tone = bb > 0.05 ? 'var(--call)' : bb < -0.05 ? 'var(--loss)' : 'var(--ink-3)';
    return `<td class="num ev" style="color:${tone}">${bb > 0 ? '+' : ''}${bb.toFixed(2)}</td>`;
  };

  // What the seat does with everything, which is the number people quote: an
  // opening frequency. The categories below it are the same figure split up.
  const whole = new Float64Array(d.actions.length);
  let allCombos = 0;
  let wholeEv = 0;
  let pricedCombos = 0;
  for (const node of d.tree) {
    for (let a = 0; a < d.actions.length; a += 1) whole[a] += node.combos * node.mix[a];
    allCombos += node.combos;
    if (node.ev !== null) {
      wholeEv += node.combos * node.ev;
      pricedCombos += node.combos;
    }
  }
  const barOf = (mix) => `<span class="bar">`
    + d.actions.map((action, i) => `<i style="width:${(mix[i] * 100).toFixed(2)}%;`
      + `background:${colourFor(action)}"></i>`).join('') + '</span>';

  const wholeMix = Array.from(whole, (v) => v / allCombos);
  const summary = `<tr class="whole">`
    + `<td class="name"><span class="twist"></span>Every hand</td>`
    + `<td class="num">${allCombos.toLocaleString()}</td>`
    + `<td>${barOf(wholeMix)}</td>`
    + wholeMix.map((v) => `<td class="num">${(v * 100).toFixed(0)}%</td>`).join('')
    + money(pricedCombos ? wholeEv / pricedCombos : null)
    + `</tr>`;

  const body = rows.map(({ id, depth, node }) => {
    const twist = node.children.length ? (state.open.has(id) ? '▾' : '▸') : '';
    const name = node.children.length
      ? `<button data-row="${id}"><span class="twist">${twist}</span>${node.label}</button>`
      : `<span class="twist"></span>${node.label}`;
    const cells = node.mix.map((v) => `<td class="num">${(v * 100).toFixed(0)}%</td>`).join('');
    return `<tr class="${node.kind}">`
      + `<td class="name" style="padding-left:${10 + depth * 18}px">${name}</td>`
      + `<td class="num">${node.combos.toLocaleString()}</td>`
      + `<td>${barOf(node.mix)}</td>${cells}${money(node.ev)}</tr>`;
  }).join('');

  $('range').innerHTML = `<table><thead>${head}</thead><tbody>${summary}${body}</tbody></table>`;
  for (const button of $('range').querySelectorAll('button[data-row]')) {
    button.onclick = () => {
      const id = button.dataset.row;
      if (state.open.has(id)) state.open.delete(id);
      else state.open.add(id);
      renderRange();
    };
  }
}

function render() {
  renderViews();
  renderSeats();
  renderLegend();
  renderRange();
  renderMeta();
}

const solve = await fetch('/api/solve').then((r) => r.json());
if (!solve.running) {
  $('range').innerHTML = '<div class="loading">This server has no solve loaded.<br>'
    + 'Restart it with <code>--solve</code>.</div>';
} else {
  names = solve.names;
  state.order = solve.order;
  state.stacks = solve.stacks;
  state.views = solve.views;
  state.players = solve.players;
  await load(solve.views[0].root, 0);
}
</script>
</body>
</html>
